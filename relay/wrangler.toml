name = "horus-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

# Durable Objects for stateful connections
[durable_objects]
bindings = [{ name = "RELAY", class_name = "RelayDO" }]

[[migrations]]
tag = "v1"
new_classes = ["RelayDO"]

# Set via dashboard: Settings → Variables → Add variable
# AUTH_TOKEN = "your-random-secret-token-here"
# Generate with: openssl rand -hex 32
